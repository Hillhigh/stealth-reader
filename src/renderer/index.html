<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="shell">
    <header id="titlebar">
      <div class="title-text">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">待命</span>
      </div>
      <div class="title-actions">
        <button id="btnMode" title="切换定位模式">自由摆放</button>
        <button id="btnStealth" title="老板键隐藏/恢复">隐身</button>
        <button id="btnHide" title="淡出隐藏">收起</button>
        <button id="btnQuit" title="退出" class="close">×</button>
      </div>
    </header>
    <div id="content">
      <div id="loading">
        <div class="spinner"></div>
        <p>正在加载书架…</p>
        <button id="btnReload">重新加载</button>
      </div>
      <webview id="reader" partition="persist:fanqie"></webview>
    </div>
    <div id="onboarding" class="hidden">
      <div class="ob-card">
        <div class="ob-title">欢迎使用 Input Helper</div>
        <div class="ob-body">
          <p><b>1. 移动窗口</b>：按住顶部标题栏可把窗口拖到任意位置，位置会被记住。</p>
          <p><b>2. 自动隐藏</b>：鼠标移开约 0.5 秒，窗口会就地淡出成淡淡一层；</p>
          <p><b>3. 唤出</b>：把鼠标移回窗口所在位置，它就恢复清晰。</p>
          <p><b>4. 老板键</b>：<code id="obBossKey">Ctrl+Alt+Q</code> 一键彻底隐藏，再按恢复。</p>
          <p class="ob-hint">右下角托盘图标可退出或切换模式。</p>
        </div>
        <button id="btnGotIt">知道了，开始使用</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
